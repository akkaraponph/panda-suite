name: Documentation
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'scripts/build-docs.py', 'scripts/check-docs.py', 'requirements-docs.txt', 'README*', 'SOURCE_NOTICES.md', 'plugin.json', 'skills/**', 'images/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['site/**', 'docs/**', 'scripts/build-docs.py', 'scripts/check-docs.py', 'requirements-docs.txt', 'README*', 'SOURCE_NOTICES.md', 'plugin.json', 'skills/**', 'images/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/build-docs.py
      - run: python scripts/check-docs.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
